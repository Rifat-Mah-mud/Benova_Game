            0% { transform: translateY(0) rotate(0deg); opacity: 0; }

<body class="app-body bg-background text-on-background relative overflow-hidden" data-preview-screen="summary">

<div class="absolute inset-0 pointer-events-none overflow-hidden z-0" id="particles"></div>
<div class="app-shell">
<main class="app-main" style="padding-top:1.5rem;">
<header class="greeting-block mb-2">

<div class="mascot-stage hero-scene" style="height:clamp(200px,42vmin,260px);margin-left:0;margin-right:0;">
<div class="mascot-stage__rays"></div>
<div class="mascot-stage__aura"></div>
<div class="mascot-stage__platform"></div>
<div class="mascot-stage__character-wrap">
<img alt="Proud Skeleton Mascot" class="mascot-stage__character" src="../shared/mascots/outside/skeleton-age-8.png">
</div>
<span class="material-symbols-outlined text-primary-container absolute top-2 right-4 text-3xl animate-pulse z-10" style="color:#e2165f;">auto_awesome</span>
<span class="material-symbols-outlined absolute bottom-10 left-2 text-2xl animate-bounce z-10" style="color:#00647c;">star</span>
</div>
<div class="score-strip mb-4">
<span class="material-symbols-outlined" style="color:#00647c;">military_tech</span>
<span>Best: <strong style="color:#005db6;">1450</strong> · Top: <strong style="color:#00647c;">1800</strong></span>

<div class="stat-card">
<span class="material-symbols-outlined stat-card__icon" style="color:#b80049;">stars</span>

<span class="stat-card__value">1450</span>
</div>

<span class="stat-card__value">12:45</span>
</div>
<div class="stat-card">
<span class="material-symbols-outlined stat-card__icon" style="color:#8f6f73;">fastfood</span>

</div>

</button>

<script>
        // Simple celebration particles
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('particles');
            const colors = ['#e2165f', '#005db6', '#007f9c', '#b7eaff']; // primary-container, secondary, tertiary-container, tertiary-fixed
            
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Randomize properties
                const left = Math.random() * 100;
                const size = Math.random() * 8 + 4;
                const duration = Math.random() * 3 + 2;
                const delay = Math.random() * 2;
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                particle.style.left = `${left}%`;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.backgroundColor = color;
                particle.style.animation = `float-particle ${duration}s ease-in ${delay}s infinite`;
                
                container.appendChild(particle);
            }
        });
    </script>
