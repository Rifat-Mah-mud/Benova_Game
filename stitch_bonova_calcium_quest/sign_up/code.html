<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title>Sign Up - Bonova Calcium Quest</title>
<link href="../shared/mobile-ui.css" rel="stylesheet">

<body class="app-body bg-background text-on-background font-body-md antialiased" data-preview-screen="signup">
<div class="ambient-bg" aria-hidden="true">
<div class="ambient-bg__orb ambient-bg__orb--1"></div>
<div class="ambient-bg__orb ambient-bg__orb--2"></div>
</div>
<div class="app-shell">
<header class="signup-header">
<h1 class="page-title" style="font-size:clamp(1.35rem,5.5vw,1.75rem);">Bonova Calcium Quest</h1>
<p class="page-subtitle" style="font-size:0.9rem;">Join the quest for stronger bones</p>
<div class="mascot-stage mascot-stage--sm">
<div class="mascot-stage__aura"></div>
<div class="mascot-stage__platform"></div>
<div class="mascot-stage__character-wrap">
<img alt="Skeleton Mascot" class="mascot-stage__character" src="../shared/mascots/outside/skeleton-age-2.png">
</div>
</div>
</header>
<main class="app-main" style="padding-top:0.5rem;">
<h2 class="greeting-title mb-4">Create Account</h2>
<form>
<div class="field-group">
<label class="field-label" for="zone">Division</label>
<div class="field-select-wrap">
<select class="field-select inner-shadow-input" id="zone" name="zone">
<option disabled selected value="">Select Division</option>
<option value="dhaka">Dhaka</option>
<option value="chattogram">Chattogram</option>
<option value="rajshahi">Rajshahi</option>
<option value="khulna">Khulna</option>
<option value="sylhet">Sylhet</option>
<option value="barishal">Barishal</option>
<option value="rangpur">Rangpur</option>
<option value="mymensingh">Mymensingh</option>
</select>
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
<div class="field-group">
<label class="field-label" for="region">District</label>
<div class="field-select-wrap">
<select class="field-select inner-shadow-input" id="region" name="region">
<option disabled selected value="">Select District</option>
<option value="dhaka">Dhaka</option>
<option value="gazipur">Gazipur</option>
<option value="narayanganj">Narayanganj</option>
<option value="narsingdi">Narsingdi</option>
</select>
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
<div class="field-group">
<label class="field-label" for="territory">Thana</label>
<div class="field-select-wrap">
<select class="field-select inner-shadow-input" id="territory" name="territory">
<option disabled selected value="">Select Thana</option>
<option value="dhanmondi">Dhanmondi</option>
<option value="gulshan">Gulshan</option>
<option value="uttara">Uttara</option>
<option value="mirpur">Mirpur</option>
</select>
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
<div class="field-group">
<label class="field-label" for="doctorName">Doctor Name</label>
<input class="field-input inner-shadow-input" id="doctorName" name="doctorName" placeholder="Dr. Mohammad Karim" type="text">
</div>
<div class="field-group">
<label class="field-label" for="fourPID">4P ID</label>
<input class="field-input inner-shadow-input" id="fourPID" name="fourPID" placeholder="Enter 4P ID" type="text">
</div>
<div class="field-group">
<label class="field-label" for="specialty">Specialty</label>
<div class="field-select-wrap">
<select class="field-select inner-shadow-input" id="specialty" name="specialty">
<option disabled selected value="">Select Specialty</option>
<option value="pediatrics">Pediatrics</option>
<option value="orthopedics">Orthopedics</option>
<option value="general">General Medicine</option>
</select>
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
<div class="field-group">
<label class="field-label" for="password">Password</label>
<input class="field-input inner-shadow-input" id="password" name="password" placeholder="••••••••" type="password">
</div>
<div class="field-group">
<label class="field-label" for="confirmPassword">Confirm Password</label>
<input class="field-input inner-shadow-input" id="confirmPassword" name="confirmPassword" placeholder="••••••••" type="password">
</div>
</form>
<div class="btn-stack mt-6" style="padding-bottom:env(safe-area-inset-bottom);">
<button class="btn-primary btn-blue" type="button" data-preview-nav="login">Create Account</button>
<a class="btn-secondary text-decoration-none" href="../login/code.html" data-preview-nav="login" style="text-decoration:none;">
Already have an account? Log In
<span class="material-symbols-outlined text-lg">arrow_forward</span>
</a>
</div>
</main>
</div>
<link href="../shared/preview-nav.css" rel="stylesheet">
<script src="../shared/preview-nav.js"></script>
</body></html>
