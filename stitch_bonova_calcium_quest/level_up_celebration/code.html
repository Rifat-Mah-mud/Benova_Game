<style>
        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 20px;
            background: #b80049;
            top: 0;
            opacity: 0;
            animation: fall linear infinite;
        }
        
        .sparkle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px 5px rgba(255, 255, 255, 0.8);
            animation: twinkle 1.5s ease-in-out infinite alternate;
        }

        @keyframes fall {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        
        @keyframes twinkle {
            0% { transform: scale(0.5); opacity: 0.3; }
            100% { transform: scale(1.5); opacity: 1; }
        }

        .level-up-pop {
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.8) translateY(50px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        
        .mascot-glow {
            animation: pulseGlow 2s infinite alternate;
        }
        
        @keyframes pulseGlow {
            0% { filter: drop-shadow(0 0 10px rgba(0, 93, 182, 0.4)); }
            100% { filter: drop-shadow(0 0 30px rgba(0, 93, 182, 0.8)); }
        }

        .mascot-stage__character-wrap {
            animation: mascot-hero-pop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .mascot-stage__character {
            animation: pulseGlow 2s infinite alternate;
        }
        @keyframes mascot-hero-pop {
            0% { transform: scale(0.85) translateY(20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
    </style>

<script>
        // Simple Confetti Generator
        const colors = ['#b80049', '#005db6', '#b7eaff', '#e2165f'];
        const container = document.getElementById('confetti-container');
        
        for (let i = 0; i < 50; i++) {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti-piece');
            
            // Randomize properties
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
            confetti.style.animationDelay = (Math.random() * 2) + 's';
            
            // Make some circular
            if (Math.random() > 0.5) {
                confetti.style.borderRadius = '50%';
                confetti.style.width = '12px';
                confetti.style.height = '12px';
            }
            
            container.appendChild(confetti);
        }

        // Match 3D skeleton to displayed bone age
        var levelUpSkeleton = document.getElementById('level-up-skeleton');
        if (levelUpSkeleton && window.SkeletonMascot) {
            levelUpSkeleton.src = '../shared/' + SkeletonMascot.forOutsideAge(6);
        }
    </script>
