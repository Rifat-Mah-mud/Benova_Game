<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="bone2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d6e3ff"/>
      <stop offset="100%" stop-color="#63a1ff"/>
    </linearGradient>
    <radialGradient id="innerGlow2" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#b7eaff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#b7eaff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="100" cy="140" rx="70" ry="90" fill="url(#innerGlow2)"/>
  <g filter="url(#glow2)">
    <!-- Skull -->
    <ellipse cx="100" cy="50" rx="40" ry="44" fill="url(#bone2)" stroke="#005db6" stroke-width="2.5"/>
    <ellipse cx="85" cy="48" rx="10" ry="12" fill="#fff" stroke="#005db6" stroke-width="1.5"/>
    <ellipse cx="115" cy="48" rx="10" ry="12" fill="#fff" stroke="#005db6" stroke-width="1.5"/>
    <circle cx="85" cy="50" r="4.5" fill="#171c1f"/>
    <circle cx="115" cy="50" r="4.5" fill="#171c1f"/>
    <circle cx="87" cy="48" r="1.5" fill="#fff"/>
    <circle cx="117" cy="48" r="1.5" fill="#fff"/>
    <path d="M90 66 Q100 74 110 66" stroke="#005db6" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Spine -->
    <rect x="93" y="86" width="14" height="58" rx="7" fill="url(#bone2)" stroke="#005db6" stroke-width="2"/>
    <!-- Ribs -->
    <path d="M65 96 Q100 108 135 96" stroke="#005db6" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M63 112 Q100 124 137 112" stroke="#005db6" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M65 128 Q100 138 135 128" stroke="#005db6" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Arms - ready pose -->
    <path d="M93 98 L55 130 L48 108" stroke="#005db6" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M107 98 L145 130 L152 108" stroke="#005db6" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="48" cy="105" r="9" fill="url(#bone2)" stroke="#005db6" stroke-width="2"/>
    <circle cx="152" cy="105" r="9" fill="url(#bone2)" stroke="#005db6" stroke-width="2"/>
    <!-- Hips -->
    <ellipse cx="100" cy="148" rx="30" ry="13" fill="url(#bone2)" stroke="#005db6" stroke-width="2"/>
    <!-- Legs -->
    <path d="M86 158 L80 218 L76 252" stroke="#005db6" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M114 158 L120 218 L124 252" stroke="#005db6" stroke-width="9" stroke-linecap="round" fill="none"/>
    <ellipse cx="76" cy="258" rx="13" ry="8" fill="url(#bone2)" stroke="#005db6" stroke-width="2"/>
    <ellipse cx="124" cy="258" rx="13" ry="8" fill="url(#bone2)" stroke="#005db6" stroke-width="2"/>
  </g>
  <!-- Calcium sparkles -->
  <circle cx="155" cy="75" r="3" fill="#ffb2be" opacity="0.9"/>
  <circle cx="42" cy="120" r="2.5" fill="#4cd6ff" opacity="0.8"/>
  <circle cx="160" cy="180" r="2" fill="#ffb2be" opacity="0.7"/>
</svg>
