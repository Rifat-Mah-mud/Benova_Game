    <rect x="92" y="84" width="16" height="60" rx="8" fill="url(#bone3)" stroke="#00468c" stroke-width="2.5"/>
    <!-- Strong ribs -->
    <path d="M60 92 Q100 106 140 92" stroke="#005db6" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M58 108 Q100 122 142 108" stroke="#005db6" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M60 124 Q100 136 140 124" stroke="#005db6" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Hero pose arms -->
    <path d="M92 96 L48 72 L38 95" stroke="#00468c" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M108 96 L152 72 L162 95" stroke="#00468c" stroke-width="9" stroke-linecap="round" fill="none"/>
    <circle cx="38" cy="98" r="10" fill="url(#bone3)" stroke="#00468c" stroke-width="2.5"/>
    <circle cx="162" cy="98" r="10" fill="url(#bone3)" stroke="#00468c" stroke-width="2.5"/>
    <!-- Hips -->
    <ellipse cx="100" cy="148" rx="32" ry="14" fill="url(#bone3)" stroke="#00468c" stroke-width="2.5"/>
    <!-- Strong legs -->
    <path d="M84 158 L78 215 L74 248" stroke="#00468c" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M116 158 L122 215 L126 248" stroke="#00468c" stroke-width="10" stroke-linecap="round" fill="none"/>
    <ellipse cx="74" cy="254" rx="14" ry="9" fill="url(#bone3)" stroke="#00468c" stroke-width="2.5"/>
    <ellipse cx="126" cy="254" rx="14" ry="9" fill="url(#bone3)" stroke="#00468c" stroke-width="2.5"/>
