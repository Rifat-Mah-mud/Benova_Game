<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="bone3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d6e3ff"/>
      <stop offset="100%" stop-color="#005db6"/>
    </linearGradient>
    <radialGradient id="heroGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#4cd6ff" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#b7eaff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#b7eaff" stop-opacity="0"/>
    </radialGradient>
    <filter id="strongGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="100" cy="135" rx="85" ry="100" fill="url(#heroGlow)"/>
  <g filter="url(#strongGlow)">
    <!-- Skull - confident -->
    <ellipse cx="100" cy="48" rx="42" ry="46" fill="url(#bone3)" stroke="#00468c" stroke-width="3"/>
