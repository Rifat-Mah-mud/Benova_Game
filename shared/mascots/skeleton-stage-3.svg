    <circle cx="86" cy="46" r="2" fill="#fff"/>
    <circle cx="118" cy="46" r="2" fill="#fff"/>
    <path d="M88 64 Q100 74 112 64" stroke="#00468c" stroke-width="2.5" stroke-linecap="round" fill="none"/>
