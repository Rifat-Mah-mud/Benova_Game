  <path d="M30 60 L32 66 L38 68 L32 70 L30 76 L28 70 L22 68 L28 66 Z" fill="#e2165f"/>
  <path d="M168 50 L170 55 L175 57 L170 59 L168 64 L166 59 L161 57 L166 55 Z" fill="#ffb2be"/>
