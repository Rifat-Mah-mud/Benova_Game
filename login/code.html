<body class="app-body bg-background text-on-background font-body-md antialiased" data-preview-screen="login">
<div class="ambient-bg" aria-hidden="true">
<div class="ambient-bg__orb ambient-bg__orb--1"></div>
<div class="ambient-bg__orb ambient-bg__orb--2"></div>
<div class="ambient-bg__orb ambient-bg__orb--3"></div>
</div>
<div class="app-shell">
<main class="app-main app-main--centered" style="padding-bottom: 7rem;">
<div class="auth-hero">
<h1 class="page-title">Bonova</h1>
<p class="page-subtitle">Calcium Quest</p>
</div>
<div class="glass-card">
<form action="#" class="flex flex-col gap-5" data-preview-nav="home">
<div class="field-group" style="margin-bottom:0">
<label class="field-label" for="id-input">4P ID</label>
<input class="field-input inner-shadow-input" id="id-input" placeholder="Enter your ID" type="text">
</div>
<div class="field-group" style="margin-bottom:0">
<label class="field-label" for="password-input">Password</label>
<div class="relative">
<input class="field-input inner-shadow-input pr-12" id="password-input" placeholder="Enter your password" type="password">
<button class="absolute right-3 top-1/2 -translate-y-1/2 w-9 h-9 flex items-center justify-center rounded-full text-on-surface-variant" onclick="togglePassword()" type="button" aria-label="Toggle password">
<span class="material-symbols-outlined text-xl" id="visibility-icon">visibility_off</span>
</button>
</div>
</div>
<button class="btn-primary btn-blue mt-2" type="submit">
Log In
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
</form>
<p class="text-center mt-6 text-sm text-on-surface-variant">
New here? <a class="text-primary font-bold hover:underline" href="../sign_up/code.html" data-preview-nav="signup">Sign Up</a>
</p>
</div>
</main>
<div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-52 h-44 pointer-events-none z-0 mascot-stage mascot-stage--sm" style="max-width:28rem;">
<div class="mascot-stage__aura"></div>
<div class="mascot-stage__platform"></div>
<div class="mascot-stage__character-wrap">
<img alt="Skeleton Mascot" class="mascot-stage__character" src="../shared/mascots/outside/skeleton-age-2.png">
</div>
</div>
</div>
<script>
        function togglePassword() {
            const pwdInput = document.getElementById('password-input');
            const icon = document.getElementById('visibility-icon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.textContent = 'visibility';
            } else {
                pwdInput.type = 'password';
                icon.textContent = 'visibility_off';
            }
        }
    </script>
<link href="../shared/preview-nav.css" rel="stylesheet">
<script src="../shared/preview-nav.js"></script>
</body></html>
