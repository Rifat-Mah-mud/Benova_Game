<body class="app-body bg-background text-on-surface font-body-md" data-preview-screen="home">
<div class="ambient-bg" aria-hidden="true">
<div class="ambient-bg__orb ambient-bg__orb--1"></div>
<div class="ambient-bg__orb ambient-bg__orb--2"></div>
<div class="ambient-bg__orb ambient-bg__orb--3"></div>
</div>
<div class="app-shell">
<header class="app-header">
<div class="app-header__row">
<button class="app-header__btn" aria-label="Menu" type="button">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="app-header__title">Bonova Calcium Quest</h1>
<button class="app-header__btn" aria-label="Account" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">account_circle</span>
</button>
</div>
</header>
<main class="app-main app-main--with-nav">
<section class="greeting-block">
<h2 class="greeting-title">Welcome back,<br>Dr. Rahman</h2>
<p class="greeting-sub">Ready to build stronger bones?</p>
<div class="score-grid">
<div class="score-chip score-chip--best">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="score-chip__text">Best: <strong>4,200</strong></span>
</div>
<div class="score-chip score-chip--top">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">workspace_premium</span>
<span class="score-chip__text">Top: 9,850</span>
</div>
</div>
</section>
<section class="hero-scene">
<div class="mascot-stage mascot-float w-full h-full">
<div class="mascot-stage__aura"></div>
<div class="mascot-stage__ground-glow"></div>
<div class="mascot-stage__platform"></div>
<div class="mascot-stage__character-wrap">
<img alt="Skeleton Mascot" class="mascot-stage__character" src="../shared/mascots/outside/skeleton-age-5.png">
</div>
</div>
<div class="stage-badge">
<span class="stage-badge__dot"></span>
Stage 2: Forming
</div>
</section>
<div class="btn-stack">
<button class="btn-primary" type="button" data-preview-nav="gameplay">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
Start Game
</button>
<button class="btn-secondary" type="button">
<span class="material-symbols-outlined">help</span>
How to Play
</button>
</div>
</main>
<nav class="bottom-nav" aria-label="Main navigation">
<div class="bottom-nav__inner">
<button class="bottom-nav__item bottom-nav__item--active" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">explore</span>
Quest
</button>
<button class="bottom-nav__item" type="button">
<span class="material-symbols-outlined">accessibility_new</span>
Skeleton
</button>

<span class="material-symbols-outlined">monitor_heart</span>
Health
</button>
<button class="bottom-nav__item" type="button">
