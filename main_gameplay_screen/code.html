<style>
        /* Ambient Tonal Depth & Soft-Tactile Modernism Styles */
        .ambient-shadow {
            box-shadow: 0 20px 40px -15px rgba(0, 93, 182, 0.08);
        }
        .inner-pressed {
            box-shadow: inset 0 2px 4px rgba(0, 93, 182, 0.1);
        }
        .tactile-button {
            transition: transform 0.1s ease-in-out, box-shadow 0.1s ease-in-out;
            box-shadow: 0 4px 0 rgba(184, 0, 73, 0.3); /* Primary shadow */
        }
        .tactile-button:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 rgba(184, 0, 73, 0.3);
        }
        
        /* Drag Motion Trail Effect */
        .motion-trail {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 9999px;
            background: inherit;
            opacity: 0.4;
            z-index: -1;
            animation: trail 1s infinite alternate;
        }
        @keyframes trail {
            0% { transform: scale(1) translate(0, 0); opacity: 0.6; }
            100% { transform: scale(1.1) translate(-10px, -20px); opacity: 0; }
        }
        
        /* Dropzone Glow — removed; feed skeleton directly */

        /* Food Token Base */
        .food-token {
            width: clamp(56px, 17vw, 76px);
            height: clamp(56px, 17vw, 76px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.35rem, 4.5vw, 1.85rem);
            position: absolute;
            background-color: white;
            box-shadow: 0 8px 20px rgba(0, 93, 182, 0.14);
            border: 2px solid #a9c7ff;
            cursor: pointer;
            user-select: none;
            touch-action: none;
        }
        
        /* Junk Food Modifier */
        .food-token.junk {
            border-color: #ffdad6;
            background-color: #fff;
        }
        
        /* Floating Animation for idle tokens */
        @keyframes float-idle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .floating {
            animation: float-idle 3s ease-in-out infinite;
        }
        .floating:nth-child(even) { animation-delay: 1.5s; }
        .floating:nth-child(3n) { animation-duration: 4s; }

        body.game-body, html {
            height: 100%;
            overflow: hidden;
            background-color: #f6fafe;
        }
        .gameplay-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }
        .play-area {
            flex: 1;
            position: relative;
            overflow: hidden;
            min-height: 0;
        }
        .mascot-zone {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: clamp(200px, 38vh, 280px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            pointer-events: none;
            z-index: 5;
        }
        .mascot-zone .mascot-stage {
            width: clamp(160px, 42vw, 200px);
            height: clamp(200px, 34vh, 250px);
            margin-bottom: 0.5rem;
            z-index: 2;
        }
        .mascot-zone .mascot-stage__aura {
            top: 2%;
            left: 50%;
            width: 64%;
            height: 40%;
            opacity: 0.55;
            animation: mascot-breathe 2.5s ease-in-out infinite;
        }
        .mascot-zone .mascot-stage--feed-target {
            transition: transform 0.25s ease, filter 0.25s ease;
        }
        .mascot-zone .mascot-stage--hover {
            transform: scale(1.03);
            filter: drop-shadow(0 8px 20px rgba(0, 100, 124, 0.35));
        }
        .mascot-zone .mascot-stage--mouth-open .mascot-stage__aura {
            opacity: 0.9;
            background: radial-gradient(circle, rgba(255, 210, 90, 0.55) 0%, rgba(255, 210, 90, 0) 70%);
            animation: mascot-mouth-glow 0.7s ease-in-out infinite;
        }
        @keyframes mascot-mouth-glow {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.08); }
        }
        .mascot-zone .mascot-stage--shake {
            animation: skeleton-shake 0.45s ease-in-out;
        }
        @keyframes skeleton-shake {
            0%, 100% { transform: translateX(0) rotate(0); }
            25% { transform: translateX(-6px) rotate(-2deg); }
            75% { transform: translateX(6px) rotate(2deg); }
        }
        .mascot-stage__character-wrap.is-eating {
            animation: skeleton-chomp 0.45s ease-in-out;
            animation-fill-mode: none;
        }
        .mascot-stage__character-wrap.is-happy {
            animation: skeleton-smile-bounce 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation-fill-mode: none;
        }
        img.mascot-stage__character {
            transform-origin: bottom center;
        }
        @keyframes skeleton-chomp {
            0%, 100% { transform: translateY(0) scale(1); }
            40% { transform: translateY(4px) scale(1.04); }
            70% { transform: translateY(2px) scale(1.02); }
        }
        @keyframes skeleton-smile-bounce {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .reaction-bubble {
            position: absolute;
            top: 2%;
            left: 50%;
            min-width: 3.25rem;
            min-height: 3.25rem;
            padding: 0.4rem 0.55rem;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 800;
            line-height: 1.1;
            text-align: center;
            white-space: nowrap;
            visibility: hidden;
            opacity: 0;
            transform: translateX(-50%) translateY(6px) scale(0.85);
            transition: opacity 0.2s ease, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), visibility 0s linear 0.3s;
            z-index: 6;
            pointer-events: none;
            box-shadow: 0 8px 20px rgba(0, 93, 182, 0.18);
        }
        .reaction-bubble--show {
            visibility: visible;
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
            transition: opacity 0.2s ease, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), visibility 0s;
        }
        .reaction-bubble--yummy {
            background: #b7eaff;
            color: #004e60;
            border: 2px solid #4cd6ff;
        }
        .reaction-bubble--not-yummy {
            background: #ffdad6;
            color: #93000a;
            border: 2px solid #ffb2be;
        }
        .mascot-stage__character-wrap--evolve {
            animation: skeleton-evolve 0.65s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation-fill-mode: none;
        }
        @keyframes skeleton-evolve {
            0% { transform: scale(0.88); opacity: 0.4; filter: brightness(1.4); }
            60% { transform: scale(1.06); opacity: 1; filter: brightness(1.15); }
            100% { transform: scale(1); opacity: 1; filter: brightness(1); }
        }
        .food-token--flying-to-mouth {
            transition: left 0.35s ease-in, top 0.35s ease-in, transform 0.35s ease-in, opacity 0.35s ease-in !important;
            z-index: 50 !important;
        }
        .food-token--eaten {
            pointer-events: none;
            animation: food-eaten 0.45s ease-in forwards;
        }
        @keyframes food-eaten {
            to { transform: scale(0); opacity: 0; }
        }
    </style>
</head>

<script>
(function () {
    var FEEDS_PER_LEVEL = 5;
    var POINTS_GOOD = 90;
    var POINTS_BAD = 15;

    var state = {
        level: 1,
        feedCount: 1,
        score: 0,
        isFeeding: false
    };

    var skeletonEl = document.getElementById('game-skeleton');
    var skeletonWrap = document.getElementById('skeleton-wrap');
    var skeletonTarget = document.getElementById('skeleton-target');
    var reactionBubble = document.getElementById('reaction-bubble');
    var progressFill = document.getElementById('progress-fill');
    var progressNodes = document.querySelectorAll('#progress-nodes .progress-node');
    var hudAge = document.getElementById('hud-age');
    var hudScore = document.getElementById('hud-score');
    var playArea = document.getElementById('play-area');
    var dragToken = null;
    var dragOffset = { x: 0, y: 0 };
    var mouthExpecting = false;
    var chewTimer = null;
    var chewAlt = false;

    function currentAge() {
        return SkeletonMascot.ageForFeedCount(state.feedCount);
    }

    function updateSkeleton(evolve) {
        var age = currentAge();
        var prevAge = parseInt(skeletonEl.getAttribute('data-age'), 10);
        if (!state.isFeeding) {
            SkeletonMascot.setAge(skeletonEl, age);
            SkeletonMascot.setFrame(skeletonEl, 'idle');
            skeletonEl = document.getElementById('game-skeleton') || skeletonEl;
        } else {
            skeletonEl.setAttribute('data-age', String(age));
        }
        if (evolve && age !== prevAge && !isNaN(prevAge)) {
            skeletonWrap.classList.remove('mascot-stage__character-wrap--evolve');
            void skeletonWrap.offsetWidth;
            skeletonWrap.classList.add('mascot-stage__character-wrap--evolve');
        }
        hudAge.textContent = age;
    }

    function updateHud() {
        hudScore.textContent = state.score;
        var pct = Math.min(100, (state.feedCount / FEEDS_PER_LEVEL) * 100);
        progressFill.style.width = pct + '%';
        progressNodes.forEach(function (node, i) {
            node.classList.toggle('progress-node--done', i < state.feedCount);
        });
    }

    function clearSkeletonMood() {
        skeletonWrap.classList.remove('is-eating', 'is-happy', 'is-unhappy');
        skeletonTarget.classList.remove('mascot-stage--shake');
    }

    function showReactionBubble(text, type) {
        reactionBubble.textContent = text;
        reactionBubble.className = 'reaction-bubble reaction-bubble--' + type;
        void reactionBubble.offsetWidth;
        reactionBubble.classList.add('reaction-bubble--show');
        clearTimeout(showReactionBubble._timer);
        showReactionBubble._timer = setTimeout(function () {
            reactionBubble.classList.remove('reaction-bubble--show');
        }, 1600);
    }

    function setSkeletonFrame(frame) {
        SkeletonMascot.setFrame(skeletonEl, frame);
        skeletonEl = document.getElementById('game-skeleton') || skeletonEl;
    }

    function getMouthPoint() {
        return SkeletonMascot.getMouthPoint(skeletonEl);
    }

    function foodNearHead(x, y) {
        return SkeletonMascot.isNearHead(skeletonEl, x, y);
    }

    function setMouthExpecting(on) {
        if (state.isFeeding) return;
        if (mouthExpecting === on) return;
        mouthExpecting = on;
        setSkeletonFrame(on ? 'mouth-open' : 'idle');
        skeletonTarget.classList.toggle('mascot-stage--mouth-open', on);
    }

    function startChewLoop() {
        stopChewLoop();
        chewAlt = false;
        setSkeletonFrame('chew');
        chewTimer = setInterval(function () {
            chewAlt = !chewAlt;
            setSkeletonFrame(chewAlt ? 'chew-2' : 'chew');
        }, 180);
    }

    function stopChewLoop() {
        if (chewTimer) {
            clearInterval(chewTimer);
            chewTimer = null;
        }
    }

    function flyFoodToMouth(token, callback) {
        var areaRect = playArea.getBoundingClientRect();
        var mouth = getMouthPoint();
        token.classList.add('food-token--flying-to-mouth');
        token.style.left = (mouth.x - areaRect.left - token.offsetWidth / 2) + 'px';
        token.style.top = (mouth.y - areaRect.top - token.offsetHeight / 2) + 'px';
        token.style.transform = 'scale(0.35)';
        token.style.opacity = '0';
        setTimeout(callback, 450);
    }

    function playEatAnimation(isGood, callback) {
        clearSkeletonMood();
        startChewLoop();
        skeletonWrap.classList.add('is-eating');
        setTimeout(function () {
            stopChewLoop();
            skeletonWrap.classList.remove('is-eating');
            setSkeletonFrame(isGood ? 'happy' : 'sad');
            skeletonWrap.classList.add(isGood ? 'is-happy' : 'is-unhappy');
            if (!isGood) skeletonTarget.classList.add('mascot-stage--shake');
            showReactionBubble(isGood ? 'Yummy!' : 'Not yummy', isGood ? 'yummy' : 'not-yummy');
            setTimeout(function () {
                clearSkeletonMood();
                setSkeletonFrame('idle');
                mouthExpecting = false;
                skeletonTarget.classList.remove('mascot-stage--mouth-open');
                state.isFeeding = false;
                if (callback) callback();
            }, isGood ? 1400 : 1200);
        }, 1200);
    }

    function onGoodFeed(token) {
        var previousAge = currentAge();
        state.feedCount = Math.min(state.feedCount + 1, FEEDS_PER_LEVEL);
        state.score += POINTS_GOOD;
        updateHud();
        setSkeletonFrame('mouth-open');
        flyFoodToMouth(token, function () {
            token.remove();
            playEatAnimation(true, function () {
                updateSkeleton(currentAge() !== previousAge);
            });
        });
    }

    function onBadFeed(token) {
        state.score = Math.max(0, state.score - POINTS_BAD);
        updateHud();
        setSkeletonFrame('mouth-open');
        flyFoodToMouth(token, function () {
            token.remove();
            playEatAnimation(false);
        });
    }

    function hitSkeleton(x, y) {
        var rect = skeletonTarget.getBoundingClientRect();
        var padX = rect.width * 0.08;
        var padTop = rect.height * 0.05;
        return (
            x >= rect.left + padX &&
            x <= rect.right - padX &&
            y >= rect.top + padTop &&
            y <= rect.bottom
        );
    }

    function onPointerDown(e) {
        if (state.isFeeding) return;
        var token = e.target.closest('.food-token');
        if (!token || token.classList.contains('food-token--eaten')) return;
        dragToken = token;
        var areaRect = playArea.getBoundingClientRect();
        var rect = token.getBoundingClientRect();
        dragOffset.x = e.clientX - rect.left;
        dragOffset.y = e.clientY - rect.top;
        token.setPointerCapture(e.pointerId);
        token.classList.remove('floating');
        token.style.position = 'absolute';
        token.style.left = (rect.left - areaRect.left) + 'px';
        token.style.top = (rect.top - areaRect.top) + 'px';
        token.style.right = 'auto';
        token.style.transform = 'none';
        token.style.zIndex = '40';
        e.preventDefault();
    }

    function onPointerMove(e) {
        if (!dragToken) return;
        var areaRect = playArea.getBoundingClientRect();
        dragToken.style.left = (e.clientX - areaRect.left - dragOffset.x) + 'px';
        dragToken.style.top = (e.clientY - areaRect.top - dragOffset.y) + 'px';
        dragToken.style.right = 'auto';
        dragToken.style.transform = 'none';
        skeletonTarget.classList.toggle('mascot-stage--hover', hitSkeleton(e.clientX, e.clientY));
        setMouthExpecting(foodNearHead(e.clientX, e.clientY));
    }

    function onPointerUp(e) {
        if (!dragToken) return;
        skeletonTarget.classList.remove('mascot-stage--hover');
        var token = dragToken;
        var isCalcium = token.dataset.calcium === 'true';
        dragToken = null;
        token.style.zIndex = '';

        if (hitSkeleton(e.clientX, e.clientY)) {
            state.isFeeding = true;
            mouthExpecting = true;
            skeletonTarget.classList.add('mascot-stage--mouth-open');
            token.classList.add('food-token--eaten');
            if (isCalcium && state.feedCount < FEEDS_PER_LEVEL) {
                onGoodFeed(token);
            } else {
                onBadFeed(token);
            }
            return;
        }
        setMouthExpecting(false);
    }

    playArea.addEventListener('pointerdown', onPointerDown);
    playArea.addEventListener('pointermove', onPointerMove);
    playArea.addEventListener('pointerup', onPointerUp);
    playArea.addEventListener('pointercancel', onPointerUp);

    updateSkeleton(false);
    updateHud();
})();
</script>
